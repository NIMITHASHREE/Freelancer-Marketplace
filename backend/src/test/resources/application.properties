spring.datasource.url=jdbc:h2:mem:freelancer_marketplace_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-key-with-at-least-thirty-two-characters
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000
