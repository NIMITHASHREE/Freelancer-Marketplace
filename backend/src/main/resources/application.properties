# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/freelancer_marketplace?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# App
server.port=${PORT:8080}
app.platform.fee.percent=${PLATFORM_FEE_PERCENT:10}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT
app.jwt.secret=${JWT_SECRET:freelancer-marketplace-super-secret-key-2024-minimum-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
